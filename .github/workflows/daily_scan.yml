name: Dining Menu Alerts

on:
  schedule:
    # GitHub Actions cron is UTC and cannot read user config directly.
    # Run periodically; the scanner decides whether the user's local schedule is due.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restore scanner state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cal_dining_scanner_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Cal Dining Scanner
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          LOCATIONS: ${{ vars.LOCATIONS }}
          MEALS: ${{ vars.MEALS }}
          SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE }}
          SCHEDULE_TIMES: ${{ vars.SCHEDULE_TIMES }}
          SCHEDULE_DAYS: ${{ vars.SCHEDULE_DAYS }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 cal_dining_scanner.py --scheduled
          else
            python3 cal_dining_scanner.py --run-now
          fi
